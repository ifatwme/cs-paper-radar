# HTTPS reverse proxy in front of the FastAPI app. Mounted by deploy/compose.server.yml.
server_tokens off;

proxy_cache_path /tmp/cache levels=1:2 keys_zone=static:4m max_size=32m inactive=1d use_temp_path=off;

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    # Plain HTTP sent to the TLS port: redirect instead of nginx's 400 page.
    # $http_host keeps the public port (the container listens on 8443, published elsewhere).
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/json application/rss+xml application/javascript image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.inc;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /static/ {
        proxy_pass http://app:8000;
        proxy_cache static;
        proxy_cache_valid 200 1d;
        expires 7d;
        include /etc/nginx/snippets/security-headers.inc;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
