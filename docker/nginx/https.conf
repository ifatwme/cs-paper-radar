# Public HTTPS reverse proxy in front of the FastAPI app. Mounted by deploy/compose.server.yml.
#
# Hardening for a public endpoint on a shared host:
#   * only GET/HEAD reach the app (the site is read-only)
#   * per-IP rate limits; expensive endpoints (topic analysis, search) are stricter
#   * per-IP connection cap, short client timeouts (slow-loris)
#   * micro-cache: identical page/API requests within a short window are served by
#     nginx, so bursts and crawlers do not reach Python
#   * strict security headers incl. Content-Security-Policy (no third-party code)
server_tokens off;

proxy_cache_path /tmp/cache/static levels=1:2 keys_zone=static:2m max_size=16m inactive=1d use_temp_path=off;
proxy_cache_path /tmp/cache/pages  levels=1:2 keys_zone=pages:8m max_size=48m inactive=30m use_temp_path=off;

limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=heavy:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;
limit_req_status  429;
limit_conn_status 429;

# Swagger UI (/api/docs) loads its assets from jsDelivr; everything else is same-origin.
map $uri $csp {
    ~^/api/docs  "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
    default      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain HTTP sent to the TLS port: redirect instead of nginx's 400 page.
    # $http_host keeps the public port (the container listens on 8443, published elsewhere).
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_conn conns 30;

    gzip on;
    gzip_types text/css application/json application/rss+xml application/javascript image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.inc;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /static/ {
        limit_req zone=perip burst=60 nodelay;
        proxy_pass http://app:8000;
        proxy_cache static;
        proxy_cache_valid 200 1d;
        expires 7d;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # Topic analysis and search run embeddings + clustering: strict per-IP limit,
    # and identical queries are cached for 10 minutes.
    location ~ ^/(topic|api/topic|api/search)$ {
        limit_req zone=heavy burst=10 nodelay;
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/snippets/proxy.inc;
        proxy_cache pages;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    location / {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/snippets/proxy.inc;
        proxy_cache pages;
        proxy_cache_valid 200 2m;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.inc;
    }
}
