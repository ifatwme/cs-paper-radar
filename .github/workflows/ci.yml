name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Import every module
        run: |
          python - <<'EOF'
          import importlib, pkgutil, cs_paper_radar
          for m in pkgutil.walk_packages(cs_paper_radar.__path__, "cs_paper_radar."):
              importlib.import_module(m.name)
              print("ok", m.name)
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/app.Dockerfile -t cs-paper-radar:ci .
      - name: Smoke test (keyword-only mode, synthetic empty DB)
        run: |
          docker run -d --name radar -e EMBEDDINGS=off -p 8000:8000 cs-paper-radar:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          curl -fsS http://127.0.0.1:8000/api/stats
          docker run --rm --entrypoint cs-paper-radar cs-paper-radar:ci --help
      - name: Compose files are valid
        run: |
          docker compose config -q
          TLS_DIR=/tmp docker compose -f docker-compose.yml -f deploy/compose.server.yml config -q
