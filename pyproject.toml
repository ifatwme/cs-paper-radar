[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-paper-radar"
dynamic = ["version"]
description = "Daily arXiv CS/CE listings, weekly top-N papers and topic frontiers (arXiv API, extensible to other sources)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ifatwme" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cs-paper-radar = "cs_paper_radar.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cs_paper_radar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cs_paper_radar = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "UP017"]
